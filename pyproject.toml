[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=42", "scikit-build", "cmake>=3.15", "ninja", "pandas", "nanobind", "git+https://github.com/iomaganaris/icon4py.git@benchmarking_main"]  # Add your build dependencies

[project]
authors = [{name = "Your Name", email = "your.email@example.com"}]
description = "A Python package with a CMake project"
name = "my_cmake_project"
version = "0.1.0"

[tool.setuptools]
include-package-data = true
